name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      # The app reads VITE_SUPABASE_* at module load and throws without them.
      # These are build-time placeholders, not credentials — the anon key is
      # public anyway, and CI never talks to a real project.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  database:
    name: migrations · RLS assertions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Applies every migration to a throwaway Postgres and asserts the
      # security properties: that anon cannot enumerate, that share links still
      # work, that claiming is one-way, that billing events cannot be forged.
      - name: Run migration + RLS suite
        run: ./supabase/tests/run.sh
